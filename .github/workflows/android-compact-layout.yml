name: Android compact responsive layout QA
on:
  push:
    branches: [work/android-compact-layout-20261015]
    paths: ['android-native/**', '.github/workflows/android-compact-layout.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Prepare SDK and licensed Cairo
        working-directory: android-native
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
          bash scripts/install_font_assets.sh
      - name: Native unit tests and release candidate
        working-directory: android-native
        run: gradle --no-daemon testDebugUnitTest assembleQa assembleCandidate --stacktrace
      - name: Collect APK and signature verifier
        run: |
          mkdir -p compact-candidate
          cp android-native/app/build/outputs/apk/candidate/*.apk compact-candidate/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" compact-candidate/
      - uses: actions/upload-artifact@v4
        with:
          name: Android-Compact-4.8.32-Build49816-Candidate
          path: compact-candidate/
      - uses: actions/upload-artifact@v4
        with:
          name: Android-Compact-QA-APK
          path: android-native/app/build/outputs/apk/qa/app-qa.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-Compact-Unit-Results
          path: android-native/app/build/test-results/testDebugUnitTest/
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Android-Compact-QA-APK
          path: android-native/app/build/outputs/apk/qa/
      - name: Enable virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise compact native screens, keyboard and retained drafts
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            python3 android-native/scripts/compact_layout_qa.py --output "$RUNNER_TEMP/compact-qa" ${{ matrix.api == 26 && '--smoke' || '' }}
            python3 android-native/scripts/phone_verification_qa.py --kind email --output "$RUNNER_TEMP/verification-email"
            python3 android-native/scripts/phone_verification_qa.py --kind phone --output "$RUNNER_TEMP/verification-phone"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-Compact-API${{ matrix.api }}-Evidence
          path: |
            ${{ runner.temp }}/compact-qa/
            ${{ runner.temp }}/verification-email/
            ${{ runner.temp }}/verification-phone/
