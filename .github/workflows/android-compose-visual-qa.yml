name: Native Android guest-screen emulator visual QA
on:
  push:
    branches: [android-from-ios-compose]
    paths:
      - 'android-from-ios/**'
      - '.github/workflows/android-compose-visual-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: murshid-android-emulator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-emulator:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK for visual launch test
        working-directory: android-from-ios
        run: gradle --no-daemon :app:assembleDebug
      - name: Emulator screenshots and app-launch smoke check
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 2560M
          heap-size: 256M
          emulator-boot-timeout: 780
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -noaudio -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none -camera-front none
          script: |
            set -eu
            adb install -r android-from-ios/app/build/outputs/apk/debug/app-debug.apk
            python3 android-from-ios/qa/native_visual_smoke.py
      # Guest, login and blank registration screens contain no student credentials.
      # Keep a versioned visual snapshot in a dedicated QA branch for manual inspection.
      - name: Publish anonymized native UI screenshots for visual comparison
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [ ! -s android-from-ios/visual-qa/guest.png ]; then
            echo "No guest screenshot captured; leave visual verification unapproved."
            exit 0
          fi
          QA_BRANCH="android-visual-qa"
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$QA_BRANCH" >/dev/null 2>&1; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/heads/$QA_BRANCH" -f sha="$GITHUB_SHA" >/dev/null
          fi
          for page in guest login register; do
            file="android-from-ios/visual-qa/$page.png"
            [ -s "$file" ] || continue
            path="visual-qa/$page.png"
            encoded="$(base64 < "$file" | tr -d '\n')"
            old="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$QA_BRANCH" --jq .sha 2>/dev/null || true)"
            if [ -n "$old" ]; then
              gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$path" \
                -f message="Capture native Android QA $page ($GITHUB_SHA)" \
                -f branch="$QA_BRANCH" -f sha="$old" -f content="$encoded" >/dev/null
            else
              gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$path" \
                -f message="Capture native Android QA $page ($GITHUB_SHA)" \
                -f branch="$QA_BRANCH" -f content="$encoded" >/dev/null
            fi
          done
      - name: Save screenshot and semantic view tree
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Native-Android-Guest-Visual-QA
          path: android-from-ios/visual-qa/
          retention-days: 30
          if-no-files-found: warn
