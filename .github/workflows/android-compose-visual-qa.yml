name: Native Android guest-screen emulator visual QA
on:
  push:
    branches: [android-from-ios-compose]
    paths:
      - 'android-from-ios/**'
      - '.github/workflows/android-compose-visual-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: murshid-android-emulator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK for visual launch test
        working-directory: android-from-ios
        run: gradle --no-daemon :app:assembleDebug
      - name: Enable KVM for visual inspection
        run: |
          set -e
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Emulator screenshots and app-launch smoke check
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 3072M
          heap-size: 384M
          emulator-boot-timeout: 780
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -noaudio -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none -camera-front none
          script: |
            set -eu
            adb install -r android-from-ios/app/build/outputs/apk/debug/app-debug.apk
            python3 android-from-ios/qa/native_visual_smoke.py
      - name: Save screenshot and semantic view tree
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Native-Android-Guest-Visual-QA
          path: android-from-ios/visual-qa/
          retention-days: 30
          if-no-files-found: warn
