name: Android OS Biometric Prompt
on:
  workflow_dispatch:
  push:
    branches: [android-native]
    paths: ['qa-android/**', '.github/workflows/android-biometric-prompt.yml']
permissions:
  contents: read
concurrency:
  group: android-biometric-prompt-${{ github.ref }}
  cancel-in-progress: true
jobs:
  os-fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Build disposable QA package
        working-directory: android-native
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          gradle --no-daemon assembleQa
      - name: Enable emulator virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 qa-android/biometric_prompt_qa.py --output "$RUNNER_TEMP/murshid-biometric-prompt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Murshid-OS-Biometric-Prompt-API35
          path: ${{ runner.temp }}/murshid-biometric-prompt/
