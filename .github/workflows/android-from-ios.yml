name: Build Android from iOS Native Compose
on:
  push:
    branches: [android-from-ios-compose]
    paths:
      - 'android-from-ios/**'
      - '.github/workflows/android-from-ios.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Native-only and secure transport guardrails
        working-directory: android-from-ios
        run: |
          set -euo pipefail
          if grep -R -nE 'android\\.webkit\\.WebView|WebViewClient|loadUrl\\(' app/src/main/java; then
            echo "WebView implementation detected; Android port must remain native."
            exit 1
          fi
          grep -q 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -q 'https://www.mur-iq.com/' app/src/main/java/com/muriq/murshid/iosparity/net/MurshidApi.kt
          test -f app/src/main/java/com/muriq/murshid/iosparity/data/QuestionPresentation.kt
      - name: Latest iPhone compatibility invariants
        working-directory: android-from-ios
        run: |
          grep -Fq 'IosPortRules.visibleTabs' app/src/main/java/com/muriq/murshid/iosparity/MainActivity.kt
          grep -Fq 'Five tabs stay visible' app/src/main/java/com/muriq/murshid/iosparity/data/IosPortRules.kt
          ! grep -R -nE 'android.speech.tts|TextToSpeech' app/src/main/java
      - name: Build fresh native Compose app
        working-directory: android-from-ios
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Run Android native unit tests
        working-directory: android-from-ios
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Validate APK integrity
        working-directory: android-from-ios
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -F 'classes.dex'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"
      - name: Publish versioned native Android preview APK
        if: github.ref == 'refs/heads/android-from-ios-compose'
        working-directory: android-from-ios
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="android-v4.9.13-compose-native-preview"
          APK="Murshid_Wizari_Android_v4_9_13_NATIVE_PREVIEW.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          NOTES="Independent Android Kotlin Jetpack Compose port of the iPhone 4.9.x student experience. Native guest landing, three-step account creation, code verification, five tabs, subjects/exams, account and subscriptions. Preview only, debug-signed for owner testing; no WebView. Not certified pixel-perfect. Offline school-ad push, comprehensive signed-in device QA and production signing remain separate release gates. This release is NOT suitable for public production deployment."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$APK.sha256" --clobber
          else
            gh release create "$TAG" "$APK" "$APK.sha256" --target "$GITHUB_SHA" --prerelease --title 'Murshid Android Native 4.9.13 — Private Testing Preview' --notes "$NOTES"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Murshid-Android-From-iOS-Compose
          path: android-from-ios/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
