name: Build Android from iOS Native Compose
on:
  push:
    branches: [android-from-ios-compose]
    paths:
      - 'android-from-ios/**'
      - '.github/workflows/android-from-ios.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Native-only and secure transport guardrails
        working-directory: android-from-ios
        run: |
          set -euo pipefail
          if grep -R -nE 'android\\.webkit\\.WebView|WebViewClient|loadUrl\\(' app/src/main/java; then
            echo "WebView implementation detected; Android port must remain native."
            exit 1
          fi
          grep -q 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -q 'https://www.mur-iq.com/' app/src/main/java/com/muriq/murshid/iosparity/net/MurshidApi.kt
          test -f app/src/main/java/com/muriq/murshid/iosparity/data/QuestionPresentation.kt
      - name: Build fresh native Compose app
        working-directory: android-from-ios
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Run Android native unit tests
        working-directory: android-from-ios
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Validate APK integrity
        working-directory: android-from-ios
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -F 'classes.dex'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: Murshid-Android-From-iOS-Compose
          path: android-from-ios/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
