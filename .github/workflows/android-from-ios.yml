name: Build Android from iOS Native Compose
on:
  push:
    branches: [android-from-ios-compose]
    paths:
      - 'android-from-ios/**'
      - '.github/workflows/android-from-ios.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: murshid-android-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Native-only and secure transport guardrails
        working-directory: android-from-ios
        run: |
          set -euo pipefail
          if grep -R -nE 'android\\.webkit\\.WebView|WebViewClient|loadUrl\\(' app/src/main/java; then
            echo "WebView implementation detected; Android port must remain native."
            exit 1
          fi
          grep -q 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -q 'https://www.mur-iq.com/' app/src/main/java/com/muriq/murshid/iosparity/net/MurshidApi.kt
          test -f app/src/main/java/com/muriq/murshid/iosparity/data/QuestionPresentation.kt
      - name: Latest iPhone compatibility invariants
        working-directory: android-from-ios
        run: |
          grep -Fq 'IosPortRules.visibleTabs' app/src/main/java/com/muriq/murshid/iosparity/MainActivity.kt
          grep -Fq 'Five tabs stay visible' app/src/main/java/com/muriq/murshid/iosparity/data/IosPortRules.kt
          ! grep -R -nE 'android.speech.tts|TextToSpeech' app/src/main/java
      # QA build only. Reuse this non-production signing key across workflow runs so
      # an installed preview can be upgraded without signature mismatch.
      - name: Reuse QA debug signing key between builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: murshid-native-compose-qa-debug-signing-v1
      - name: Build fresh native Compose app
        working-directory: android-from-ios
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Run Android native unit tests
        working-directory: android-from-ios
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Validate APK integrity
        working-directory: android-from-ios
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -F 'classes.dex'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"
      - name: Publish versioned native Android preview APK
        if: github.ref == 'refs/heads/android-from-ios-compose'
        working-directory: android-from-ios
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Never let an obsolete workflow overwrite the newest APK artifact.
          CURRENT_HEAD="$(gh api "repos/$GITHUB_REPOSITORY/branches/android-from-ios-compose" --jq '.commit.sha')"
          if [ "$CURRENT_HEAD" != "$GITHUB_SHA" ]; then
            echo "Outdated build: $GITHUB_SHA (branch is $CURRENT_HEAD); skipping release update."
            exit 0
          fi
          TAG="android-v4.9.16-compose-native-preview"
          APK="Murshid_Wizari_Android_v4_9_16_NATIVE_PREVIEW.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          NOTES="QA-only native Android with iPhone grouped dark/light background and card contrast, corrected email/phone danger-code validation; Kotlin/Compose build based on the owner iPhone UX. Features: complete guest instructions, registration and in-app verification, remembered sessions and OS biometric gate, subject exams, subscriber predictions, school ads, study-plan creation, and three student color palettes. Adds one-time Android 13+ notification permission request plus local WorkManager school ad fallback and ad-tab deep linking when tapped. School ads in the background are checked periodically (minimum 15 minutes; Android may delay), NOT instantaneous FCM push. A production push backend, user-account end-to-end tests, device screenshot parity and release-signing remain unverified. This APK is debug-signed for private testing only, not a final public student release."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$APK.sha256" --clobber
          else
            gh release create "$TAG" "$APK" "$APK.sha256" --target "$GITHUB_SHA" --prerelease --title 'Murshid Android Native 4.9.16 — Private Testing Preview' --notes "$NOTES"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Murshid-Android-From-iOS-Compose
          path: android-from-ios/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
