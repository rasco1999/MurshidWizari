name: Android Google Play Signed Release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          test -n "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - name: Install licensed Cairo font
        run: bash scripts/install_font_assets.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify upload signing secrets are configured
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::Missing ANDROID_UPLOAD_KEYSTORE_BASE64"; exit 1; }
          test -n "$STORE_PASS" || { echo "::error::Missing ANDROID_UPLOAD_STORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing ANDROID_UPLOAD_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASS" || { echo "::error::Missing ANDROID_UPLOAD_KEY_PASSWORD"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/murshid-upload-keystore.jks"
          test -s "$RUNNER_TEMP/murshid-upload-keystore.jks"
          chmod 600 "$RUNNER_TEMP/murshid-upload-keystore.jks"
      - name: Unit tests and signed APK / Play AAB
        env:
          MURSHID_RELEASE_KEYSTORE: ${{ runner.temp }}/murshid-upload-keystore.jks
          MURSHID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          MURSHID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          MURSHID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          gradle --no-daemon testDebugUnitTest assembleRelease bundleRelease --stacktrace
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MurshidWizari-Play-SIGNED-49807
          path: |
            android-native/app/build/outputs/apk/release/app-release.apk
            android-native/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
      - name: Erase transient signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/murshid-upload-keystore.jks"
