name: Android Play signed release (owner upload key)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android-native
    env:
      MURSHID_UPLOAD_KEYSTORE_B64: ${{ secrets.MURSHID_UPLOAD_KEYSTORE_B64 }}
      MURSHID_RELEASE_STORE_PASSWORD: ${{ secrets.MURSHID_RELEASE_STORE_PASSWORD }}
      MURSHID_RELEASE_KEY_ALIAS: ${{ secrets.MURSHID_RELEASE_KEY_ALIAS }}
      MURSHID_RELEASE_KEY_PASSWORD: ${{ secrets.MURSHID_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          test -n "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Materialize owner upload key without printing secrets
        run: |
          set -euo pipefail
          test -n "$MURSHID_UPLOAD_KEYSTORE_B64" || { echo "Missing owner upload keystore secret"; exit 1; }
          test -n "$MURSHID_RELEASE_STORE_PASSWORD"
          test -n "$MURSHID_RELEASE_KEY_ALIAS"
          test -n "$MURSHID_RELEASE_KEY_PASSWORD"
          printf '%s' "$MURSHID_UPLOAD_KEYSTORE_B64" | base64 -d > play-upload-key.jks
          chmod 600 play-upload-key.jks
          test -s play-upload-key.jks
          echo "MURSHID_RELEASE_KEYSTORE=$PWD/play-upload-key.jks" >> "$GITHUB_ENV"
      - name: Verify tests, build signed APK and Play AAB
        run: gradle --no-daemon testDebugUnitTest assembleRelease bundleRelease --stacktrace
      - name: Check outputs and signatures
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          unzip -t app/build/outputs/bundle/release/app-release.aab >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: MurshidWizari-Google-Play-Signed-49803
          path: |
            android-native/app/build/outputs/apk/release/app-release.apk
            android-native/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
