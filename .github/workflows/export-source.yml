name: Export Current iOS Source

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/export-source.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct current production source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, pathlib
          parts = [
              'build-src/chunk00.b64',
              'build-src/chunk01.b64',
              'build-src/chunk02.b64',
              'build-src/chunk03.b64',
              'build-src/chunk04.b64',
              'build-src/fix05a.b64',
              'build-src/fix05b.b64',
              'build-src/chunk06.b64',
              'build-src/chunk07.b64',
          ]
          payload=b''.join(base64.b64decode(pathlib.Path(p).read_text().strip()) for p in parts)
          pathlib.Path('base-source.zip').write_bytes(payload)
          PY
          mkdir extracted
          unzip -q base-source.zip -d extracted
          cp patches/AuthViews.swift extracted/MurshidWizari/AuthViews.swift
          cp patches/APIClient.swift extracted/MurshidWizari/APIClient.swift
          (cd extracted && zip -qry ../MurshidWizari-current-source.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: MurshidWizari-current-source
          path: MurshidWizari-current-source.zip
          retention-days: 1
