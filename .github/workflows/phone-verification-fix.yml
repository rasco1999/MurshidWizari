name: Phone verification hotfix QA
on:
  push:
    branches: [work/android-phone-verification-fix-20261015]
    paths: ['android-native/**', 'phone-verification-fix/**', '.github/workflows/phone-verification-fix.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify actual PHP controller and isolated session contract
        run: |
          php -l phone-verification-fix/public_html/api/verify-phone.php
          python3 -m unittest discover -s phone-verification-fix/tests -p 'test_endpoint.py' -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare SDK and Cairo
        working-directory: android-native
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
          bash scripts/install_font_assets.sh
      - name: Run native unit tests and build unchanged UI with the phone fix
        working-directory: android-native
        run: gradle --no-daemon testDebugUnitTest assembleQa assembleCandidate --stacktrace
      - name: Collect candidate and verifier
        run: |
          mkdir -p phone-candidate
          cp android-native/app/build/outputs/apk/candidate/*.apk phone-candidate/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" phone-candidate/
      - uses: actions/upload-artifact@v4
        with:
          name: Murshid-Phone-Fix-4.8.30-Build49814-Candidate
          path: phone-candidate/
          if-no-files-found: error
      - name: Enable emulator virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise phone registration, cookies, invalid and valid codes on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 android-native/scripts/phone_verification_qa.py --output "$RUNNER_TEMP/phone-verification-qa"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Murshid-Phone-Verification-Focused-QA
          path: |
            ${{ runner.temp }}/phone-verification-qa/
            android-native/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
