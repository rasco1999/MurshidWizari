name: Android Native Anonymous Emulator Smoke

on:
  workflow_dispatch:
  push:
    branches: [android-native]
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native-emulator.yml'

permissions:
  contents: read

jobs:
  anonymous-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 29, 33, 35]
    steps:
      - uses: actions/checkout@v4
      - name: Verify scroll-aware UI harness
        run: python3 -m unittest discover -s android-native/scripts -p 'test_ui_helpers.py' -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK and build QA-only debug APK
        working-directory: android-native
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          gradle --no-daemon testDebugUnitTest assembleDebug assembleQa
      - name: Enable emulator virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise anonymous native login controls, recovery and register, and capture layouts
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            python3 android-native/scripts/anonymous_emulator_qa.py --output "$RUNNER_TEMP/murshid-anonymous-qa"
            python3 android-native/scripts/student_fixture_qa.py --output "$RUNNER_TEMP/murshid-anonymous-qa/student"
            python3 android-native/scripts/specialized_exam_qa.py --output "$RUNNER_TEMP/murshid-anonymous-qa/specialized"
      - name: Upload anonymous layout screenshots and accessibility hierarchy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Murshid-Native-Anonymous-Emulator-QA-API${{ matrix.api-level }}
          path: ${{ runner.temp }}/murshid-anonymous-qa/
          if-no-files-found: warn
