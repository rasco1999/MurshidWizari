name: Android Native Debug APK
on:
  workflow_dispatch:
  pull_request:
    branches: [android-native]
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native.yml'
  push:
    branches: [android-native]
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: synthetic-ci-only
          MYSQL_DATABASE: murshid_push_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psynthetic-ci-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@v4
      - name: Verify Android push PHP and isolated database behavior
        env:
          FCM_TEST_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=murshid_push_test;charset=utf8mb4'
          FCM_TEST_USER: root
          FCM_TEST_PASSWORD: synthetic-ci-only
        run: |
          find server-push -name '*.php' -print0 | xargs -0 -n1 php -l
          php server-push/tests/integration.php
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest images already include Android SDK; setup-android@v3
      # attempts to install the removed legacy "tools" package.
      - name: Install Android SDK platform 35
        run: |
          test -n "$ANDROID_HOME"
          echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - name: Install licensed Cairo font
        run: bash scripts/install_font_assets.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify exam rules and build native APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug assembleQa assemblePreview assembleCandidate bundleCandidate --stacktrace
      - name: Verify Cairo font and license embedded in preview APK
        run: |
          unzip -Z1 app/build/outputs/apk/preview/app-preview.apk | grep -F 'res/font/cairo.ttf'
          unzip -Z1 app/build/outputs/apk/preview/app-preview.apk | grep -F 'assets/licenses/OFL_Cairo.txt'
      - name: Verify side-by-side preview application ID
        run: |
          test -s app/build/outputs/apk/preview/app-preview.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/preview/app-preview.apk | grep -F "name='com.murshidwizari.student.preview'"
      - uses: actions/upload-artifact@v4
        with:
          name: MurshidWizari-Native-Android-debug
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: MurshidWizari-Student-Build498-Preview-Android
          path: android-native/app/build/outputs/apk/preview/app-preview.apk
          if-no-files-found: error

      - name: Confirm Play candidate app bundle
        run: |
          test -s app/build/outputs/bundle/candidate/app-candidate.aab
          unzip -t app/build/outputs/bundle/candidate/app-candidate.aab >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: MurshidWizari-Play-AAB-Unsigned-Build49808
          path: android-native/app/build/outputs/bundle/candidate/app-candidate.aab
          if-no-files-found: error

      - name: Collect unsigned candidate and signing verifier
        run: |
          mkdir -p candidate-artifact
          cp app/build/outputs/apk/candidate/*.apk candidate-artifact/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" candidate-artifact/
      - uses: actions/upload-artifact@v4
        with:
          name: MurshidWizari-Student-4.8.18-candidate
          path: android-native/candidate-artifact/
          if-no-files-found: error
