name: Android Native Debug APK
on:
  workflow_dispatch:
  push:
    branches: [android-native]
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest images already include Android SDK; setup-android@v3
      # attempts to install the removed legacy "tools" package.
      - name: Install Android SDK platform 35
        run: |
          test -n "$ANDROID_HOME"
          echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify exam rules and build native APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MurshidWizari-Native-Android-debug
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
