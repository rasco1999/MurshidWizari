name: Final APK native validation
on:
  push:
    branches: [work/android-iphone-parity-20261019]
    paths: ['qa-parity/**', '.github/workflows/android-parity-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
        suite: [pages, specialized, offline]
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -rf android-native
          mkdir android-native
          unzip -q android-parity/source.zip -d android-native
          cp qa-parity/*.py android-native/scripts/
      - uses: actions/download-artifact@v4
        with:
          name: Murshid-4.8.39-Build49823-Preview-and-QA
          run-id: 39210262035
          github-token: ${{ github.token }}
          path: android-native/app/build
      - name: Enable emulator virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          heap-size: 256M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash qa-parity/run_validation.sh "$RUNNER_TEMP/validation" '${{ matrix.suite }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Murshid-Final-API${{ matrix.api }}-${{ matrix.suite }}
          path: ${{ runner.temp }}/validation/
