name: Structured matching web and native UI QA
on:
  push:
    branches: [work/questions-matching-20261015]
    paths: ['android-native/**', 'server-release/**', '.github/workflows/questions-matching-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: V53_WEB_ROOT=server-release/public_html node server-release/tests/web_matching_qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Structured-Matching-Web-Evidence
          path: question_audit/web-evidence/
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Build actual QA app
        working-directory: android-native
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
          bash scripts/install_font_assets.sh
          gradle --no-daemon assembleQa
      - name: Enable virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            python3 android-native/scripts/matching_qa.py --output "$RUNNER_TEMP/matching-native/normal"
            python3 android-native/scripts/matching_qa.py --large-font --output "$RUNNER_TEMP/matching-native/large-font"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Structured-Matching-Android-Evidence
          path: ${{ runner.temp }}/matching-native/
