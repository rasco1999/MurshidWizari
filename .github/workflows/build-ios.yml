name: Build Murshid iOS Production v2 IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-ios.yml'
      - 'patches/**'

permissions:
  contents: read

jobs:
  build:
    name: Build Production v2 unsigned iPhone IPA
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode environment
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Reconstruct exact Production v2 source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, pathlib
          parts = [
              'build-src/chunk00.b64',
              'build-src/chunk01.b64',
              'build-src/chunk02.b64',
              'build-src/chunk03.b64',
              'build-src/chunk04.b64',
              'build-src/fix05a.b64',
              'build-src/fix05b.b64',
              'build-src/chunk06.b64',
              'build-src/chunk07.b64',
          ]
          payload = b''.join(base64.b64decode(pathlib.Path(p).read_text().strip()) for p in parts)
          pathlib.Path('MurshidWizari_Production_v2_BUILD_SOURCE.zip').write_bytes(payload)
          PY
          EXPECTED="9786c1fe6e7a96ec0c5476925cc505eeb14c1a5d7d9126f3824e2694e7107838"
          ACTUAL="$(shasum -a 256 MurshidWizari_Production_v2_BUILD_SOURCE.zip | awk '{print $1}')"
          echo "Expected SHA256: $EXPECTED"
          echo "Actual SHA256:   $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          rm -rf source
          mkdir source
          unzip -q MurshidWizari_Production_v2_BUILD_SOURCE.zip -d source

      - name: Apply Swift 6 concurrency fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # Ensure XcodeGen includes the full asset catalog and uses iPhone-only v2 metadata.
          p = Path('source/project.yml')
          lines = p.read_text().splitlines()
          out = []
          inserted = False
          for line in lines:
              if line.strip() == '- Assets.xcassets':
                  continue
              out.append(line)
              if line == '        PRODUCT_NAME: MurshidWizari':
                  out.extend([
                      '        TARGETED_DEVICE_FAMILY: "1"',
                      '        MARKETING_VERSION: "2.1.0"',
                      '        CURRENT_PROJECT_VERSION: "210"',
                      '        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon',
                  ])
                  inserted = True
          if not inserted:
              raise SystemExit('Expected target PRODUCT_NAME setting not found')
          p.write_text('\n'.join(out) + '\n')

          p = Path('source/MurshidWizari/APIClient.swift')
          s = p.read_text()
          s = s.replace('final class APIClient {', '@MainActor\nfinal class APIClient {')
          p.write_text(s)

          p = Path('source/MurshidWizari/Services.swift')
          s = p.read_text()
          s = s.replace('final class KeychainVault {', '@MainActor\nfinal class KeychainVault {')
          s = s.replace('actor ResponseCache {', '@MainActor\nfinal class ResponseCache {')
          p.write_text(s)

          p = Path('source/MurshidWizari/Theme.swift')
          s = p.read_text()
          s = s.replace('func haptic(_ type:', '@MainActor\nfunc haptic(_ type:')
          s = s.replace('func selectionHaptic() {', '@MainActor\nfunc selectionHaptic() {')
          p.write_text(s)

          p = Path('source/MurshidWizari/AccountViews.swift')
          s = p.read_text()
          s = s.replace('throw APIError.message("رابط الدفع غير صالح.", 422)', 'throw APIError(message: "رابط الدفع غير صالح.", status: 422, paymentRequired: false)')
          p.write_text(s)
          PY

      - name: Apply iPhone auth and native password recovery v2.1
        shell: bash
        run: |
          set -euo pipefail
          cp patches/AuthViews.swift source/MurshidWizari/AuthViews.swift
          cp patches/APIClient.swift source/MurshidWizari/APIClient.swift
          swiftc -parse source/MurshidWizari/AuthViews.swift
          swiftc -parse source/MurshidWizari/APIClient.swift

      - name: Install XcodeGen
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        working-directory: source
        run: |
          set -euo pipefail
          xcodegen generate
          test -d MurshidWizari.xcodeproj
          xcodebuild -project MurshidWizari.xcodeproj -scheme MurshidWizari -showBuildSettings > /tmp/murshid-build-settings.txt

      - name: Build Release for iPhone
        working-directory: source
        run: |
          set -euo pipefail
          xcodebuild \
            -project MurshidWizari.xcodeproj \
            -scheme MurshidWizari \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            MARKETING_VERSION='2.1.0' \
            CURRENT_PROJECT_VERSION='210' \
            clean build

      - name: Compile Apple asset catalog
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          rm -f /tmp/murshid-asset-info.plist
          xcrun actool MurshidWizari/Assets.xcassets \
            --compile "$APP" \
            --platform iphoneos \
            --minimum-deployment-target 16.0 \
            --target-device iphone \
            --app-icon AppIcon \
            --output-partial-info-plist /tmp/murshid-asset-info.plist
          test -f "$APP/Assets.car"
          python3 - <<'PY'
          import plistlib, glob
          app = glob.glob('build/Build/Products/Release-iphoneos/*.app')[0]
          info_path = app + '/Info.plist'
          with open(info_path,'rb') as f: info = plistlib.load(f)
          with open('/tmp/murshid-asset-info.plist','rb') as f: partial = plistlib.load(f)
          info.update(partial)
          info['CFBundleDisplayName'] = 'المرشد الوزاري'
          info['CFBundleName'] = 'منصة المرشد الوزاري'
          info['CFBundleShortVersionString'] = '2.1.0'
          info['CFBundleVersion'] = '210'
          info['NSFaceIDUsageDescription'] = 'استخدم Face ID لفتح المرشد الوزاري وحماية حسابك الدراسي.'
          info['UISupportedInterfaceOrientations'] = ['UIInterfaceOrientationPortrait']
          info['UILaunchScreen'] = {'UIColorName': 'LaunchBackground'}
          info['UIDeviceFamily'] = [1]
          info.pop('CFBundleIcons~ipad', None)
          with open(info_path,'wb') as f: plistlib.dump(info,f,fmt=plistlib.FMT_BINARY)
          PY

      - name: Validate and package IPA
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          test -f "$APP/MurshidWizari"
          EXE="$APP/MurshidWizari"
          echo "App path: $APP"
          file "$EXE"
          lipo -info "$EXE"
          otool -L "$EXE"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx 'com.muriq.murshid'
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName المرشد الوزاري' "$APP/Info.plist" 2>/dev/null || /usr/libexec/PlistBuddy -c 'Add :CFBundleDisplayName string المرشد الوزاري' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleName منصة المرشد الوزاري' "$APP/Info.plist" 2>/dev/null || /usr/libexec/PlistBuddy -c 'Add :CFBundleName string منصة المرشد الوزاري' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString 2.1.0' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 210' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Delete :UIDeviceFamily' "$APP/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :UIDeviceFamily array' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :UIDeviceFamily:0 integer 1' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist" | grep -Fx 'المرشد الوزاري'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$APP/Info.plist" | grep -Fx 'منصة المرشد الوزاري'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | grep -Fx '2.1.0'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist" | grep -Fx '210'
          /usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily:0' "$APP/Info.plist" | grep -Fx '1'
          test -f "$APP/Assets.car"
          echo "Assets.car present:"
          ls -lh "$APP/Assets.car"
          find "$APP" -maxdepth 1 -type f -name 'AppIcon*.png' -print
          if otool -L "$EXE" | grep -q '/WebKit.framework/'; then
            echo 'ERROR: WebKit linked unexpectedly.' >&2
            exit 1
          fi
          if strings "$EXE" | grep -Eiq 'WKWebView|Capacitor|Cordova'; then
            echo 'ERROR: Web wrapper marker found unexpectedly.' >&2
            exit 1
          fi
          rm -rf Payload Murshid_Wizari_iOS_Production_v2_1_unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry Murshid_Wizari_iOS_Production_v2_1_unsigned.ipa Payload
          test -s Murshid_Wizari_iOS_Production_v2_1_unsigned.ipa
          shasum -a 256 Murshid_Wizari_iOS_Production_v2_1_unsigned.ipa | tee Murshid_Wizari_iOS_Production_v2_1_unsigned.sha256

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Murshid-Wizari-iOS-Production-v2.1-Unsigned
          path: |
            source/Murshid_Wizari_iOS_Production_v2_1_unsigned.ipa
            source/Murshid_Wizari_iOS_Production_v2_1_unsigned.sha256
          if-no-files-found: error
          retention-days: 14
