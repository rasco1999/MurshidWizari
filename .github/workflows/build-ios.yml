name: Build Native iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: ['MurshidWizari/**','project.yml','.github/workflows/build-ios.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Xcode environment
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned native app
        run: xcodebuild -project MurshidWizari.xcodeproj -scheme MurshidWizari -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" clean build
      - name: Validate and package
        run: |
          set -e
          APP="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          EXE="$APP/MurshidWizari"
          test -f "$EXE"
          file "$EXE"
          lipo -info "$EXE"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx 'com.muriq.murshid'
          if otool -L "$EXE" | grep -q '/WebKit.framework/'; then echo "WebKit found"; exit 1; fi
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Murshid_Wizari_Native_unsigned.ipa Payload
          shasum -a 256 Murshid_Wizari_Native_unsigned.ipa > SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Murshid-Wizari-Native-IPA
          path: |
            Murshid_Wizari_Native_unsigned.ipa
            SHA256.txt
          if-no-files-found: error
          retention-days: 14
