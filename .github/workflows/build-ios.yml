      - name: Publish v4.8.12 unsigned IPA release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd source
          TAG="v4.8.12-build492"
          TITLE="Murshid Wizari iOS v4.8.12 Build 492"
          NOTES="Unsigned IPA v4.8.12: Arabic on-device question speech, eliminating distractors, ministerial trap drills, golden recall cards, visual chapter map, mock pacing and prior-score comparison, direct question deep links, a daily-challenge WidgetKit shortcut and prominent error reporting. Verified badges require server-verified metadata; grade-specific APNs opt-in and bulk-import validation are staged for server/admin integration in server_updates/v4_8_12. All v4.8.11 features remain."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              Murshid_Wizari_iOS_Production_v4_8_12_BUILD492_unsigned.ipa \
              Murshid_Wizari_iOS_Production_v4_8_12_BUILD492_unsigned.sha256 \
              --clobber
          else
            gh release create "$TAG" \
              Murshid_Wizari_iOS_Production_v4_8_12_BUILD492_unsigned.ipa \
              Murshid_Wizari_iOS_Production_v4_8_12_BUILD492_unsigned.sha256 \
              --title "$TITLE" \
              --notes "$NOTES"
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Murshid-Wizari-iOS-Production-v4.8.12-Build492-Unsigned
          path: |
            source/Murshid_Wizari_iOS_Production_v4_8_12_BUILD492_unsigned.ipa
            source/Murshid_Wizari_iOS_Production_v4_8_12_BUILD492_unsigned.sha256
          if-no-files-found: error
          retention-days: 14


  diagnostics:
    name: Publish v4.8.12 build diagnostics
    needs: build
    if: github.ref == 'refs/heads/main' && always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Save build result and failed logs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -u
          mkdir -p .build-status
          STATUS_FILE=".build-status/v4.8.12-build492-status.txt"
          LOG_FILE=".build-status/v4.8.12-build492-failed.log"
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "commit=$GITHUB_SHA"
            echo "result=$BUILD_RESULT"
            echo "workflow=$GITHUB_WORKFLOW"
          } > "$STATUS_FILE"
          gh run view "$GITHUB_RUN_ID" --log-failed > "$LOG_FILE" 2>&1 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$STATUS_FILE" "$LOG_FILE"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record v4.8.12 build result [skip ci]"
          git pull --rebase origin main || true
          git push origin HEAD:main
