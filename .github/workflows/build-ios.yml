name: Build Murshid iOS Production v4.8.12 IPA

on:
  workflow_dispatch:
  push:
    branches: [ build/ios-study-recovery-20261009 ]
    paths:
      - '.github/workflows/build-ios.yml'
      - 'patches/**'

permissions:
  contents: write

jobs:
  build:
    name: Build Production v4.8.12 unsigned iPhone IPA
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode environment
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Reconstruct exact Production v2 source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, pathlib
          parts = [
              'build-src/chunk00.b64',
              'build-src/chunk01.b64',
              'build-src/chunk02.b64',
              'build-src/chunk03.b64',
              'build-src/chunk04.b64',
              'build-src/fix05a.b64',
              'build-src/fix05b.b64',
              'build-src/chunk06.b64',
              'build-src/chunk07.b64',
          ]
          payload = b''.join(base64.b64decode(pathlib.Path(p).read_text().strip()) for p in parts)
          pathlib.Path('MurshidWizari_Production_v2_BUILD_SOURCE.zip').write_bytes(payload)
          PY
          EXPECTED="9786c1fe6e7a96ec0c5476925cc505eeb14c1a5d7d9126f3824e2694e7107838"
          ACTUAL="$(shasum -a 256 MurshidWizari_Production_v2_BUILD_SOURCE.zip | awk '{print $1}')"
          echo "Expected SHA256: $EXPECTED"
          echo "Actual SHA256:   $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          rm -rf source
          mkdir source
          unzip -q MurshidWizari_Production_v2_BUILD_SOURCE.zip -d source

      - name: Apply Swift 6 concurrency fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # Ensure XcodeGen includes the full asset catalog and uses iPhone-only v2 metadata.
          p = Path('source/project.yml')
          lines = p.read_text().splitlines()
          out = []
          inserted = False
          for line in lines:
              if line.strip() == '- Assets.xcassets':
                  continue
              out.append(line)
              if line == '        PRODUCT_NAME: MurshidWizari':
                  out.extend([
                      '        TARGETED_DEVICE_FAMILY: "1"',
                      '        MARKETING_VERSION: "4.8.12"',
                      '        CURRENT_PROJECT_VERSION: "492"',
                      '        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon',
                      '        CODE_SIGN_ENTITLEMENTS: MurshidWizari/MurshidWizari.entitlements',
                  ])
                  inserted = True
          if not inserted:
              raise SystemExit('Expected target PRODUCT_NAME setting not found')
          p.write_text('\n'.join(out) + '\n')
          # A lightweight native WidgetKit extension deep-links to the daily
          # challenge without fetching media or duplicating the student's data.
          spec = p.read_text()
          anchor = '    scheme: {}\n'
          widget_target = '\n'.join([
              '    dependencies:',
              '      - target: MurshidQuestionWidget',
              '        embed: true',
              '  MurshidQuestionWidget:',
              '    type: app-extension',
              '    platform: iOS',
              '    sources:',
              '      - path: MurshidQuestionWidget',
              '        excludes:',
              '          - Info.plist',
              '    info:',
              '      path: MurshidQuestionWidget/Info.plist',
              '    settings:',
              '      base:',
              '        PRODUCT_BUNDLE_IDENTIFIER: com.muriq.murshid.widget',
              '        PRODUCT_NAME: MurshidQuestionWidget',
              '        INFOPLIST_FILE: MurshidQuestionWidget/Info.plist',
              '        APPLICATION_EXTENSION_API_ONLY: YES',
              '        TARGETED_DEVICE_FAMILY: "1"',
              '        SKIP_INSTALL: YES',
              '        CODE_SIGNING_ALLOWED: NO',
              '        CODE_SIGNING_REQUIRED: NO',
              '        CODE_SIGN_IDENTITY: ""',
          ]) + '\n'
          if spec.count(anchor) != 1:
              raise SystemExit('Widget target anchor not unique')
          p.write_text(spec.replace(anchor, anchor + widget_target, 1))

          p = Path('source/MurshidWizari/APIClient.swift')
          s = p.read_text()
          s = s.replace('final class APIClient {', '@MainActor\nfinal class APIClient {')
          s = s.replace('"X-Murshid-App": "ios-native-3.0"', '"X-Murshid-App": "ios-native-3.3"')
          p.write_text(s)

          p = Path('source/MurshidWizari/Services.swift')
          s = p.read_text()
          old = "\n".join([
              '        let context = LAContext()',
              '        context.localizedCancelTitle = "إلغاء"',
              '        do {',
              '            let ok = try await context.evaluatePolicy(.deviceOwnerAuthentication, localizedReason: "افتح المرشد الوزاري للعودة إلى دراستك")',
              '            isLocked = !ok',
              '        } catch { isLocked = true }'
          ])
          new = "\n".join([
              '        let context = LAContext()',
              '        context.localizedCancelTitle = "إلغاء"',
              '        context.localizedFallbackTitle = ""',
              '        var authError: NSError?',
              '        guard context.canEvaluatePolicy(.deviceOwnerAuthenticationWithBiometrics, error: &authError), context.biometryType == .faceID else {',
              '            UserDefaults.standard.set(false, forKey: "biometric_lock")',
              '            isLocked = false',
              '            return',
              '        }',
              '        do {',
              '            let ok = try await context.evaluatePolicy(.deviceOwnerAuthenticationWithBiometrics, localizedReason: "افتح المرشد الوزاري باستخدام Face ID")',
              '            isLocked = !ok',
              '        } catch { isLocked = true }'
          ])
          if old not in s:
              raise SystemExit('Expected biometric block not found')
          s = s.replace(old, new)
          s = s.replace('final class KeychainVault {', '@MainActor\nfinal class KeychainVault {')
          s = s.replace('actor ResponseCache {', '@MainActor\nfinal class ResponseCache {')
          p.write_text(s)

          p = Path('source/MurshidWizari/Theme.swift')
          s = p.read_text()
          s = s.replace('func haptic(_ type:', '@MainActor\nfunc haptic(_ type:')
          s = s.replace('func selectionHaptic() {', '@MainActor\nfunc selectionHaptic() {')
          p.write_text(s)

          p = Path('source/MurshidWizari/AccountViews.swift')
          s = p.read_text()
          s = s.replace('throw APIError.message("رابط الدفع غير صالح.", 422)', 'throw APIError(message: "رابط الدفع غير صالح.", status: 422, paymentRequired: false)')
          p.write_text(s)
          PY

      - name: Apply iPhone auth and native password recovery v2.5
        shell: bash
        run: |
          set -euo pipefail
          cp patches/AuthViews.swift source/MurshidWizari/AuthViews.swift
          cp patches/APIClient.swift source/MurshidWizari/APIClient.swift
          cp patches/MurshidWizariApp.swift source/MurshidWizari/MurshidWizariApp.swift
          cp patches/V31Features.swift source/MurshidWizari/V31Features.swift
          cp patches/V40Features.swift source/MurshidWizari/V40Features.swift
          cp patches/V43Enhancements.swift source/MurshidWizari/V43Enhancements.swift
          cp patches/V44StudentFeatures.swift source/MurshidWizari/V44StudentFeatures.swift
          cp patches/V45ContestWelcome.swift source/MurshidWizari/V45ContestWelcome.swift
          cp patches/V46LearningExtras.swift source/MurshidWizari/V46LearningExtras.swift
          cp -R patches/widget source/MurshidQuestionWidget
          cp patches/ServicesV32.swift source/MurshidWizari/Services.swift
          cp patches/ThemeV34.swift source/MurshidWizari/Theme.swift
          cp patches/MainViewsV33.swift source/MurshidWizari/MainViews.swift
          cp patches/ExamViewV33.swift source/MurshidWizari/ExamView.swift
          python3 - <<'PY'
          from pathlib import Path
          # New server questions can opt in to a verified source badge; older
          # payloads remain unverified by default, never implicitly certified.
          p=Path('source/MurshidWizari/Models.swift')
          s=p.read_text()
          s=s.replace('    let submitted: Bool\n', '    let verified: Bool\n    let sourceLabel: String\n    let submitted: Bool\n', 1)
          s=s.replace('        submitted = jBool(json["submitted"])', '        verified = jBool(json["verified"])\n        sourceLabel = jString(json["source_label"])\n        submitted = jBool(json["submitted"])', 1)
          p.write_text(s)
          p=Path('source/MurshidWizari/AuthViews.swift')
          s=p.read_text()
          s=s.replace('NavigationStack { V3HomeView() }','NavigationStack { V31HomeView() }',1)
          s=s.replace('NavigationStack { V3AccountView() }','NavigationStack { V31AccountView() }',1)
          s=s.replace('نسخة iPhone 4.3 • Build 470','نسخة iPhone 4.8.12 • Build 492')
          p.write_text(s)
          p=Path('source/MurshidWizari/MurshidWizariApp.swift')
          s=p.read_text()
          s=s.replace('struct MurshidWizariApp: App {','struct MurshidWizariApp: App {\n    @UIApplicationDelegateAdaptor(MurshidAppDelegate.self) private var appDelegate',1)
          s=s.replace('استخدم Face ID أو رمز الجهاز للعودة إلى حسابك.','استخدم Face ID للعودة إلى حسابك.')
          p.write_text(s)
          PY
          # Reconstruct the user's untouched 1024x1024 gold school PNG. The
          # supplied image is already the required Apple icon dimensions.
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib
          encoded=''.join(Path('patches/v31-icon/chunk00.b64').read_text().split())
          raw=base64.b64decode(encoded)
          digest=hashlib.sha256(raw).hexdigest()
          print("Original gold school icon SHA256:", digest)
          expected='5980669a7f862104a94174e9034761567f5e2ad49c1792cbda560cf37c31ec01'
          if digest != expected:
              raise SystemExit("App icon digest mismatch")
          if not raw.startswith(b'\x89PNG\r\n\x1a\n'):
              raise SystemExit("Expected the original PNG icon")
          Path('/tmp/murshid-gold-school-icon.png').write_bytes(raw)
          PY
          ICONSET="source/MurshidWizari/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICONSET"
          rm -f "$ICONSET"/*.png
          # No resizing, cropping, color adjustments, or recompression.
          cp /tmp/murshid-gold-school-icon.png "$ICONSET/AppIcon-Light.png"
          cp "$ICONSET/AppIcon-Light.png" "$ICONSET/AppIcon-Dark.png"
          cp "$ICONSET/AppIcon-Light.png" "$ICONSET/AppIcon-Tinted.png"
          shasum -a 256 "$ICONSET/AppIcon-Light.png" | grep -Fq '5980669a7f862104a94174e9034761567f5e2ad49c1792cbda560cf37c31ec01'
          cat > "$ICONSET/Contents.json" <<'JSON'
          {
            "images" : [
              {"filename":"AppIcon-Light.png","idiom":"universal","platform":"ios","size":"1024x1024"},
              {"appearances":[{"appearance":"luminosity","value":"dark"}],"filename":"AppIcon-Dark.png","idiom":"universal","platform":"ios","size":"1024x1024"},
              {"appearances":[{"appearance":"luminosity","value":"tinted"}],"filename":"AppIcon-Tinted.png","idiom":"universal","platform":"ios","size":"1024x1024"}
            ],
            "info":{"author":"xcode","version":1}
          }
          JSON

          # Privacy manifest required for UserDefaults use.
          cat > source/MurshidWizari/PrivacyInfo.xcprivacy <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>NSPrivacyTracking</key><false/>
            <key>NSPrivacyTrackingDomains</key><array/>
            <key>NSPrivacyCollectedDataTypes</key><array/>
            <key>NSPrivacyAccessedAPITypes</key>
            <array>
              <dict>
                <key>NSPrivacyAccessedAPIType</key><string>NSPrivacyAccessedAPICategoryUserDefaults</string>
                <key>NSPrivacyAccessedAPITypeReasons</key><array><string>CA92.1</string></array>
              </dict>
            </array>
          </dict></plist>
          PLIST

          # APNs entitlement. The final signed build must use a provisioning profile with Push enabled.
          cat > source/MurshidWizari/MurshidWizari.entitlements <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>aps-environment</key><string>production</string>
          </dict></plist>
          PLIST

          swiftc -parse source/MurshidWizari/AuthViews.swift
          swiftc -parse source/MurshidWizari/APIClient.swift
          swiftc -parse source/MurshidWizari/MurshidWizariApp.swift
          swiftc -parse source/MurshidWizari/V31Features.swift
          swiftc -parse source/MurshidWizari/V40Features.swift
          swiftc -parse source/MurshidWizari/V43Enhancements.swift
          swiftc -parse source/MurshidWizari/V44StudentFeatures.swift
          swiftc -parse source/MurshidWizari/V45ContestWelcome.swift
          swiftc -parse source/MurshidWizari/Theme.swift
          swiftc -parse source/MurshidWizari/MainViews.swift
          swiftc -parse source/MurshidWizari/ExamView.swift

      - name: Runtime-check Arabic name normalization on macOS
        shell: bash
        run: |
          cat >/tmp/namecheck.swift <<'SWIFT'
          import Foundation

          func normalizedPersonName(_ value: String) -> String {
              let hidden: Set<UInt32> = [
                  0x200E, 0x200F, 0x061C,
                  0x202A, 0x202B, 0x202C, 0x202D, 0x202E,
                  0x2066, 0x2067, 0x2068, 0x2069,
                  0xFEFF
              ]
              var result = ""
              var pendingSpace = false
              for scalar in value.precomposedStringWithCanonicalMapping.unicodeScalars {
                  if hidden.contains(scalar.value) { continue }
                  if CharacterSet.whitespacesAndNewlines.contains(scalar) {
                      if !result.isEmpty { pendingSpace = true }
                      continue
                  }
                  if pendingSpace { result.append(" "); pendingSpace = false }
                  result.unicodeScalars.append(scalar)
              }
              return result.trimmingCharacters(in: .whitespacesAndNewlines)
          }

          let tests: [(String, String)] = [
              ("احمد علي حسين ت", "احمد علي حسين ت"),
              ("منتظر سعد خلف", "منتظر سعد خلف"),
              ("يونس محمد عباس", "يونس محمد عباس"),
              ("احمد\u{00A0}علي\u{200F} حسين\u{2067} ت", "احمد علي حسين ت")
          ]
          for (input, expected) in tests {
              let actual = normalizedPersonName(input)
              print("\(input) => [\(actual)]")
              if actual != expected { exit(2) }
          }
          SWIFT
          swift /tmp/namecheck.swift

      - name: Probe live registration name validation without creating account
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          RESP="$(curl -sS --max-redirs 0 --max-time 20 'https://www.mur-iq.com/api/register.php'             -H 'Content-Type: application/json; charset=utf-8'             -H 'Accept: application/json'             --data '{"full_name":"يونس محمد عباس","grade_id":0,"gender":"male","contact_type":"email","identifier":"name-probe-do-not-create@example.invalid","password":"12345678","password_confirmation":"12345678","company_website":""}')"
          echo "$RESP"
          python3 - "$RESP" <<'PY'
          import json, sys
          data=json.loads(sys.argv[1])
          msg=str(data.get("message",""))
          # Correct outcome: the live server accepted the name and advanced to grade validation.
          if "الاسم الثلاثي" in msg:
              raise SystemExit("LIVE SERVER STILL REJECTS THE ARABIC NAME")
          if "اختر الصف الدراسي" not in msg:
              raise SystemExit("Unexpected live registration probe response: "+msg)
          print("Live server accepted Arabic name; probe stopped safely at grade validation.")
          PY

      - name: Install XcodeGen
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        working-directory: source
        run: |
          set -euo pipefail
          xcodegen generate
          test -d MurshidWizari.xcodeproj
          xcodebuild -project MurshidWizari.xcodeproj -scheme MurshidWizari -showBuildSettings > /tmp/murshid-build-settings.txt

      - name: Build Release for iPhone
        working-directory: source
        run: |
          set -euo pipefail
          xcodebuild \
            -project MurshidWizari.xcodeproj \
            -scheme MurshidWizari \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            MARKETING_VERSION='4.8.12' \
            CURRENT_PROJECT_VERSION='492' \
            clean build

      - name: Compile Apple asset catalog
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          rm -f /tmp/murshid-asset-info.plist
          xcrun actool MurshidWizari/Assets.xcassets \
            --compile "$APP" \
            --platform iphoneos \
            --minimum-deployment-target 16.0 \
            --target-device iphone \
            --app-icon AppIcon \
            --output-partial-info-plist /tmp/murshid-asset-info.plist
          test -f "$APP/Assets.car"
          cp MurshidWizari/PrivacyInfo.xcprivacy "$APP/PrivacyInfo.xcprivacy"
          test -f "$APP/PrivacyInfo.xcprivacy"
          test -d "$APP/PlugIns/MurshidQuestionWidget.appex"
          grep -Fq 'AVSpeechSynthesizer()' MurshidWizari/V46LearningExtras.swift
          grep -Fq 'V46LearningDeckView(mode: .traps)' MurshidWizari/V31Features.swift
          grep -Fq 'V46LearningDeckView(mode: .golden)' MurshidWizari/V31Features.swift
          grep -Fq 'تحدّي احذف خيارين' MurshidWizari/AuthViews.swift
          grep -Fq 'خريطة الفصل' MurshidWizari/AuthViews.swift
          grep -Fq 'تحليل المحاكاة' MurshidWizari/V40Features.swift
          grep -Fq 'murshid://question' MurshidWizari/AuthViews.swift
          grep -Fq 'سؤال مدقّق' MurshidWizari/AuthViews.swift
          grep -Fq 'grade_notifications_enabled' MurshidWizari/V31Features.swift
          python3 - <<'PY'
          import plistlib, glob
          app = glob.glob('build/Build/Products/Release-iphoneos/*.app')[0]
          info_path = app + '/Info.plist'
          with open(info_path,'rb') as f: info = plistlib.load(f)
          with open('/tmp/murshid-asset-info.plist','rb') as f: partial = plistlib.load(f)
          info.update(partial)
          info['CFBundleDisplayName'] = 'المرشد الوزاري'
          info['CFBundleName'] = 'منصة المرشد الوزاري'
          info['CFBundleShortVersionString'] = '4.8.12'
          info['CFBundleVersion'] = '492'
          info['NSFaceIDUsageDescription'] = 'يستخدم المرشد الوزاري Face ID لحماية حسابك عند العودة إلى التطبيق.'
          info['CFBundleURLTypes'] = [{'CFBundleURLName': 'com.muriq.murshid', 'CFBundleURLSchemes': ['murshid']}]
          info['UISupportedInterfaceOrientations'] = ['UIInterfaceOrientationPortrait']
          info['UILaunchScreen'] = {'UIColorName': 'LaunchBackground'}
          info['UIDeviceFamily'] = [1]
          info.pop('CFBundleIcons~ipad', None)
          with open(info_path,'wb') as f: plistlib.dump(info,f,fmt=plistlib.FMT_BINARY)
          PY

      - name: Validate and package IPA
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          test -f "$APP/MurshidWizari"
          EXE="$APP/MurshidWizari"
          echo "App path: $APP"
          file "$EXE"
          lipo -info "$EXE"
          otool -L "$EXE"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx 'com.muriq.murshid'
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName المرشد الوزاري' "$APP/Info.plist" 2>/dev/null || /usr/libexec/PlistBuddy -c 'Add :CFBundleDisplayName string المرشد الوزاري' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleName منصة المرشد الوزاري' "$APP/Info.plist" 2>/dev/null || /usr/libexec/PlistBuddy -c 'Add :CFBundleName string منصة المرشد الوزاري' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString 4.8.12' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 492' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Delete :UIDeviceFamily' "$APP/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :UIDeviceFamily array' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :UIDeviceFamily:0 integer 1' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist" | grep -Fx 'المرشد الوزاري'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$APP/Info.plist" | grep -Fx 'منصة المرشد الوزاري'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | grep -Fx '4.8.12'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist" | grep -Fx '492'
          /usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily:0' "$APP/Info.plist" | grep -Fx '1'
          test -f "$APP/Assets.car"
          test -f "$APP/PrivacyInfo.xcprivacy"
          grep -Fq 'قفل حقيقي بـ Face ID' MurshidWizari/V31Features.swift
          ! grep -Fq 'NavigationLink(destination: V31SchoolAdRequestView())' MurshidWizari/V31Features.swift
          grep -Fq 'V31SchoolAdsView' MurshidWizari/V31Features.swift
          grep -Fq 'V31SchoolAdTicker' MurshidWizari/V31Features.swift
          grep -Fq 'مشاهدة فيديو الموضوع على يوتيوب' MurshidWizari/V31Features.swift
          grep -Fq 'موضوعات ' MurshidWizari/V31Features.swift
          ! grep -Fq 'سبب الترشيح' MurshidWizari/V44StudentFeatures.swift
          grep -Fq 'خدمة استعادة كلمة المرور لم تُثبَّت على الموقع' MurshidWizari/AuthViews.swift
          grep -Fq 'تسليم الإجابة' MurshidWizari/V40Features.swift
          grep -Fq 'الجواب الصحيح' MurshidWizari/V40Features.swift
          grep -Fq 'V31StudyView' MurshidWizari/AuthViews.swift
          grep -Fq 'V31StudySubjectView' MurshidWizari/V31Features.swift
          grep -Fq 'mobile/study-catalog.php' MurshidWizari/V31Features.swift
          grep -Fq 'allowsCellularAccess = true' MurshidWizari/APIClient.swift
          grep -Fq 'config.waitsForConnectivity = true' MurshidWizari/APIClient.swift
          grep -Fq 'dataWithTransientRetry' MurshidWizari/APIClient.swift
          grep -Fq 'bootstrapNeedsNetworkRetry' MurshidWizari/MurshidWizariApp.swift
          grep -Fq 'geometry.size.width - 32' MurshidWizari/V45ContestWelcome.swift
          grep -Fq 'isMeteredConnection' MurshidWizari/Services.swift
          grep -Fq 'V31PredictionsLockedView' MurshidWizari/AuthViews.swift
